<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effect map · React dependency graph</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17233c;font:14px/1.5 "Segoe UI",sans-serif}header,main{max-width:1440px;margin:auto;padding:32px 40px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-bottom:24px}.eyebrow{color:#7154bc;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}h1{font-size:32px;letter-spacing:-1px;margin:5px 0}p{margin:0;color:#738199}.stats{display:flex;gap:28px}.stats strong{display:block;font-size:24px;line-height:1.3}.stats span{color:#738199;font-size:12px}main{padding-top:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;background:white;border:1px solid #dce3ee;border-radius:14px 14px 0 0}.legend,.controls{display:flex;align-items:center;gap:16px}.legend span{display:flex;align-items:center;gap:7px;color:#596780;font-size:12px}.swatch{width:10px;height:10px;border-radius:3px;background:#ede9fe;border:1px solid #c4b5fd}.swatch.dependency{background:#f0f5ff;border-color:#c8d8f3}button{border:1px solid #dce3ee;background:white;color:#344560;border-radius:7px;min-height:34px;min-width:34px;padding:5px 10px;font:inherit;cursor:pointer}button:hover{background:#f0f5ff}button:focus-visible{outline:3px solid #a78bfa;outline-offset:3px}button:disabled{opacity:.4;cursor:default}#zoom{min-width:44px;text-align:center;color:#738199;font-size:12px}.canvas{height:72vh;min-height:360px;overflow:auto;border:1px solid #dce3ee;border-top:0;border-radius:0 0 14px 14px;background:#f5f7fb}.canvas:focus-visible{outline:3px solid #a78bfa;outline-offset:3px}svg{display:block;margin:0 auto;max-width:none;height:auto}.node path{transition:filter .15s}.node:hover path{filter:drop-shadow(0 3px 4px #b8c5db)}footer{display:flex;justify-content:space-between;gap:16px;padding:14px 3px;font-size:12px;color:#738199}footer a{color:#5b36a8;text-decoration:none}footer a:hover{text-decoration:underline}@media(max-width:700px){header,main{padding:20px 16px}header{align-items:flex-start;flex-direction:column}main{padding-top:0}.stats{gap:24px}.toolbar{align-items:flex-start;flex-direction:column}.legend{flex-wrap:wrap}footer{flex-direction:column}h1{font-size:28px}}
</style>
</head>
<body>
<header><div><div class="eyebrow">React · Dependency explorer</div><h1>Effect map</h1><p>Follow each effect back to the values it depends on.</p></div><div class="stats"><div><strong>{{EFFECTS}}</strong><span>effects</span></div><div><strong>{{NODES}}</strong><span>nodes</span></div><div><strong>{{EDGES}}</strong><span>connections</span></div><div><strong>{{FILES}}</strong><span>files</span></div></div></header>
<main><div class="toolbar"><div class="legend" aria-label="Graph legend"><span><i class="swatch"></i>Effect</span><span><i class="swatch dependency"></i>Dependency</span><span>→ depends on</span></div><div class="controls" aria-label="Zoom controls"><button id="out" aria-label="Zoom out">−</button><output id="zoom" aria-live="polite">100%</output><button id="in" aria-label="Zoom in">+</button><button id="fit">Fit width</button></div></div><div class="canvas" tabindex="0" role="region" aria-label="Effect dependency graph. Scroll to explore.">{{GRAPH}}</div><footer><span>Grouped by source file · Scroll to explore · Node labels show source lines</span><span>Export <a href="use-effects.svg" download>SVG</a> · <a href="use-effects.png" download>PNG</a></span></footer></main>
<script>
const svg = document.querySelector('svg');
const canvas = document.querySelector('.canvas');
const baseWidth = svg.viewBox.baseVal.width;
let scale = 1;
function setZoom(value) {
  scale = Math.max(0.25, Math.min(2.5, value));
  svg.style.width = `${baseWidth * scale}px`;
  document.querySelector('#zoom').value = `${Math.round(scale * 100)}%`;
  document.querySelector('#out').disabled = scale <= 0.25;
  document.querySelector('#in').disabled = scale >= 2.5;
}
document.querySelector('#out').addEventListener('click', () => setZoom(scale - 0.15));
document.querySelector('#in').addEventListener('click', () => setZoom(scale + 0.15));
document.querySelector('#fit').addEventListener('click', () => setZoom((canvas.clientWidth - 24) / baseWidth));
setZoom(Math.min(1, (canvas.clientWidth - 24) / baseWidth));
</script>
</body>
</html>
